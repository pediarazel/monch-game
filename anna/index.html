<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monopoly Online - ورود</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0a0a0a;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        font-size: 16px;
        touch-action:manipulation;
      }

      .panel{
        width:min(96vw,700px);
        display:flex; flex-wrap:wrap; gap:10px;
        justify-content:center; align-items:center;
        background:#101010;border:1px solid #252525;border-radius:14px;
        padding:12px;
      }

      .row{ width:100%; max-width:700px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }

      button{
        border:none;background:#fff;color:#000;border-radius:12px;
        padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer;
        transition:background 0.2s;
      }
      button:active{ background:#ccc; }
      button:disabled{ opacity:0.4; cursor:not-allowed; }

      .info{ width:100%; text-align:center; font-size:14px; line-height:1.8; margin-top:5px; }
      .muted{ color:#cbd5e1; font-size:13px; }
      input, select{
        width:100%;
        border:none;border-radius:10px;padding:12px;font-size:15px;
        background:#1f2937;color:#fff;outline:none;
      }
    </style>
</head>
<body>

  <div class="panel">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px; width:100%;">
      <div class="muted">ورود یا ثبت‌نام</div>

      <div class="row">
        <input id="usernameInput" type="text" placeholder="نام کاربری" />
      </div>
      <div class="row">
        <input id="passwordInput" type="password" placeholder="رمز عبور" />
      </div>

      <div style="display:flex; gap:10px; width:100%; justify-content:center; margin-top:6px;">
        <button id="loginBtn" style="background:#3b82f6;color:#fff; font-weight:700;">
          ورود
        </button>
        <button id="registerBtn" style="background:#22c55e;color:#fff;">
          ثبت‌نام
        </button>
      </div>

      <div class="muted" id="authStatus" style="min-height:18px;"></div>
      <div class="muted" id="serverMsg" style="min-height:18px;"></div>
    </div>
  </div>

  <pre id="debug" aria-label="debug" style="display:none;"></pre>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    (function(){
      const debugEl = document.getElementById('debug');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      const authStatusEl = document.getElementById('authStatus');
      const serverMsgEl = document.getElementById('serverMsg');

      let lastDebugData = {};
      function setDebug(value) {
        try {
          let nextValue = value;
          if (typeof value === "function") nextValue = value(lastDebugData);
          if (nextValue && typeof nextValue === "object" && !Array.isArray(nextValue)) {
            lastDebugData = nextValue;
          } else {
            lastDebugData = nextValue;
          }
          debugEl.textContent = typeof nextValue === "string" ? nextValue : JSON.stringify(nextValue, null, 2);
        } catch (error) {
          debugEl.textContent = String(error?.message || value || "Debug error");
        }
      }
      window.addEventListener('error', (e)=> console.error('Page Error:', e.message || e.error || e));
      window.addEventListener('unhandledrejection', (e)=> console.error('Promise Error:', e.reason && e.reason.message ? e.reason.message : e));

      const SOCKET_URL = "https://monch-game.onrender.com";
      const API_BASE = "https://monch-game.onrender.com";
      function api(path){ return API_BASE.replace(/\/$/,'') + path; }

      // --- Token helpers ---
      const TOKEN_STORAGE_KEY = "token";
      function normalizeToken(value) {
        if (value == null) return "";
        let token = String(value).trim();
        if ((token.startsWith('"') && token.endsWith('"')) || (token.startsWith("'") && token.endsWith("'"))) {
          try { token = JSON.parse(token); } catch { token = token.slice(1, -1); }
        }
        token = String(token || "").trim();
        token = token.replace(/^Bearer\s+/i, "").trim();
        return token;
      }
      function getToken() {
        const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        const token = normalizeToken(storedToken);
        if (token && token !== storedToken) localStorage.setItem(TOKEN_STORAGE_KEY, token);
        return token;
      }
      function clearToken() { localStorage.removeItem(TOKEN_STORAGE_KEY); }

function isJwtExpired(token) {
  if (!token) return true;

  try {
    const parts = token.split(".");

    if (parts.length !== 3) {
      return true;
    }

    const base64 = parts[1]
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const paddedBase64 = base64.padEnd(
      base64.length + ((4 - (base64.length % 4)) % 4),
      "="
    );

    const payload = JSON.parse(atob(paddedBase64));
    const currentTime = Math.floor(Date.now() / 1000);

    return !payload.exp || payload.exp <= currentTime;
  } catch (e) {
    console.error("JWT expiration check failed:", e);
    return true;
  }
}


      function setAuthResult(message, type = 'info') {
        authStatusEl.textContent = message;
        authStatusEl.style.color = type === 'error' ? '#f87171' : '#9ca3af';
      }

      // --- Login ---
      loginBtn.addEventListener("click", async ()=>{
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          setAuthResult("لطفاً نام کاربری و رمز عبور را وارد کنید.", "error");
          return;
        }

        try {
          setAuthResult("در حال ورود...");
          loginBtn.disabled = true;
          registerBtn.disabled = true;

          const res = await fetch(api("/api/auth/login"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            cache: "no-store"
          });

          let data;
          try { data = await res.json(); } catch { data = null; }

          if (res.ok && data?.token) {
            localStorage.setItem(TOKEN_STORAGE_KEY, data.token);
            setAuthResult("ورود موفقیت‌آمیز بود. در حال انتقال به لابی...", "success");
            setTimeout(() => window.location.href = "/lobby.html", 1500);
          } else {
            setAuthResult(data?.message || "خطا در ورود", "error");
          }
        } catch (e) {
          console.error("Login fetch error:", e);
          setAuthResult("خطا در ارتباط با سرور.", "error");
        } finally {
          loginBtn.disabled = false;
          registerBtn.disabled = false;
        }
      });

      // --- Register ---
      registerBtn.addEventListener("click", async ()=>{
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          setAuthResult("لطفاً نام کاربری و رمز عبور را وارد کنید.", "error");
          return;
        }

        try {
          setAuthResult("در حال ثبت‌نام...");
          loginBtn.disabled = true;
          registerBtn.disabled = true;

          const res = await fetch(api("/api/auth/register"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
            cache: "no-store"
          });

          let data;
          try { data = await res.json(); } catch { data = null; }

          if (res.ok && data?.token) {
            localStorage.setItem(TOKEN_STORAGE_KEY, data.token);
            setAuthResult("ثبت‌نام موفقیت‌آمیز بود. در حال انتقال به لابی...", "success");
            setTimeout(() => window.location.href = "/lobby.html", 1500);
          } else {
            setAuthResult(data?.message || "خطا در ثبت‌نام", "error");
          }
        } catch (e) {
          console.error("Register fetch error:", e);
          setAuthResult("خطا در ارتباط با سرور.", "error");
        } finally {
          loginBtn.disabled = false;
          registerBtn.disabled = false;
        }
      });

      // --- Initial Load ---
      const token = getToken();
      if (token && !isJwtExpired(token)) {
        setAuthResult("توکن معتبر است. در حال انتقال به لابی...", "success");
        setTimeout(() => window.location.href = "/lobby.html", 1500);
      } else {
        if (token) {
          console.log("Token is expired, clearing it.");
          clearToken();
        }
        setAuthResult("لطفاً وارد شوید یا ثبت‌نام کنید.");
      }

    })(); // End of IIFE
  </script>
</body>
</html>
