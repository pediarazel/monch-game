<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منچ ایران - بازی</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#000; color:#eee; font-family:sans-serif;
      display:flex; justify-content:center; align-items:center;
      min-height:100vh; direction:rtl; overflow-x:hidden;
    }
    #app{
      max-width:650px; width:100%; padding:8px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
    }
    canvas{
      display:block; margin:0 auto; max-width:100%; height:auto;
      border:1px solid #333; border-radius:8px; touch-action:none;
    }
    .panel{
      background:#111; border:1px solid #333; border-radius:10px;
      padding:10px 12px; width:100%; margin:0;
    }
    .info{
      display:flex; flex-direction:column; gap:4px;
      text-align:center; margin-top:8px; font-size:14px;
    }
    .muted{color:#888;font-size:13px;}
    button{
      background:#222; color:#eee; border:1px solid #444;
      border-radius:8px; padding:8px 16px; cursor:pointer; font-size:14px;
      transition:all 0.15s; min-width:80px;
    }
    button:disabled{opacity:0.4;cursor:not-allowed;}
    button:hover:not(:disabled){background:#333;}
#rollBtn{
  min-width:170px;
  min-height:52px;
  padding:12px 24px;
  background:#3b82f6;
  color:#fff;
  font-size:18px;
  font-weight:900;
}

    #rollBtn:disabled{background:#555;}
.dice{
  width:68px;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
  background:#1a1a2e;
  border-radius:14px;
  border:2px solid #444;
  cursor:pointer;
  transition:all 0.15s;
  user-select:none;
}
#leaveGameBtn{
  min-width:0;
  min-height:34px;
  padding:6px 11px;
  border-radius:7px;
  font-size:12px;
  background:#ef4444;
  color:#fff;
}

    .dice.selected{border-color:#3b82f6;background:#1a1a3e;box-shadow:0 0 12px #3b82f6;}
    .dice[style*="pointer-events: none"]{opacity:0.5 !important;}
    .dicePick{opacity:0.5;}
    .tag{
      display:inline-block; padding:2px 8px; border-radius:4px;
      font-size:12px; font-weight:700;
    }
    .tag.red{background:#ff4d4d;color:#fff;}
    .tag.green{background:#2ecc71;color:#fff;}
    .tag.yellow{background:#f1c40f;color:#000;}
    .tag.blue{background:#3498db;color:#fff;}
    .tag.muted{background:#555;color:#ccc;}
    .blink-me{animation:blink 0.5s ease-in-out infinite alternate;}
    @keyframes blink{from{opacity:0.3;}to{opacity:1;}}
    .rolling{animation:shake 0.1s infinite;}
    @keyframes shake{0%{transform:rotate(0deg);}25%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}100%{transform:rotate(0deg);}}
    #msg{color:#f1c40f;font-size:14px;text-align:center;min-height:20px;}
    #turnInfo{font-size:14px;text-align:center;min-height:20px;color:#ccc;}
    #socketStatus{font-size:12px;text-align:center;color:#888;min-height:16px;}
    #joinStatus{font-size:12px;text-align:center;color:#888;min-height:16px;}
    #peopleNews{font-size:12px;text-align:center;color:#888;min-height:16px;}
    #serverMsg{font-size:12px;text-align:center;color:#888;min-height:16px;}
    #emojiMenu .emoji-item {
    font-size: 24px;
    margin: 5px;
    cursor: pointer;
    padding: 3px;
    display: inline-block;
}
#emojiMenu .emoji-item:hover {
    transform: scale(1.3);
    background-color: #444;
    border-radius: 5px;
}

  </style>
</head>

<body>
  <div id="app">
    <canvas id="board" width="600" height="600"></canvas>

    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; flex-wrap:wrap;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
          <div id="dice1" class="dice dicePick">🎲</div>
          <div class="muted" style="font-size:12px;">تاس 1</div>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
          <div id="dice2" class="dice dicePick">🎲</div>
          <div class="muted" style="font-size:12px;">تاس 2</div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; align-items:center; min-width:260px;">
          <button id="rollBtn" disabled>ریختن تاس</button>
          <button id="leaveGameBtn" style="background:#ef4444;color:#fff;">خروج از بازی/صف</button>
<button id="emojiBtn" style="background:#666;color:#fff; margin-left: 10px; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2em;">😊</button>

<div id="emojiMenu" style="display: none; position: absolute; background-color: #333; border: 1px solid #555; border-radius: 8px; padding: 10px; z-index: 1000; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
    <span class="emoji-item" data-emoji="😂">😂</span>
    <span class="emoji-item" data-emoji="👍">👍</span>
    <span class="emoji-item" data-emoji="🤔">🤔</span>
    <span class="emoji-item" data-emoji="😠">😠</span>
    <span class="emoji-item" data-emoji="🥳">🥳</span>
    <span class="emoji-item" data-emoji="👀">👀</span>
    <span class="emoji-item" data-emoji="👋">👋</span>
    <span class="emoji-item" data-emoji="😭">😭</span>
</div>

        </div>
      </div>

      <div class="info">
        <div id="turnInfo"></div>
        <div id="msg"></div>
      </div>
    </div>

    <div class="panel">
      <div id="socketStatus" class="muted" style="text-align:center;"></div>
      <div id="joinStatus" class="muted" style="text-align:center;"></div>
      <div id="peopleNews" class="muted" style="min-height:18px;text-align:center;"></div>
      <div id="serverMsg" class="muted" style="min-height:18px;text-align:center;"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ====== متغیرهای پایه ======
    const msgEl = document.getElementById('msg');
    const debugEl = document.getElementById('debug');
    const socketStatusEl = document.getElementById('socketStatus');
    const joinStatusEl = document.getElementById('joinStatus');
    const peopleNewsEl = document.getElementById('peopleNews');
    const serverMsgEl = document.getElementById('serverMsg');

    function setMsg(text){ if(msgEl) msgEl.textContent = text; }
    let lastDebugData = {};
    function setDebug(value) {
      let nextValue = value;
      if (typeof value === 'object' && value !== null) {
        nextValue = { ...(lastDebugData && typeof lastDebugData === 'object' ? lastDebugData : {}), ...value };
      }
      lastDebugData = nextValue;
      if (debugEl) debugEl.textContent = JSON.stringify(nextValue, null, 2);
    }

    // ====== اول: همه متغیرها و توابع کمکی ======
    const SOCKET_URL = window.SOCKET_URL_OVERRIDE || "https://monch-game.onrender.com";
    const API_BASE = (window.API_BASE_OVERRIDE || "https://monch-game.onrender.com").trim();
    function api(path){ return API_BASE ? (API_BASE.replace(/\/$/,'') + path) : path; }

    const TOKEN_STORAGE_KEY = "token";
    function normalizeToken(value) {
      let token = String(value).trim();
      if (token.startsWith('"') && token.endsWith('"')) token = token.slice(1, -1);
      if (token.startsWith("'") && token.endsWith("'")) token = token.slice(1, -1);
      return token;
    }
    function getToken() {
      const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
      const token = normalizeToken(storedToken);
      return token || null;
    }
    function setToken(value) {
      const token = normalizeToken(value);
      localStorage.setItem(TOKEN_STORAGE_KEY, token);
    }
    function clearToken() { localStorage.removeItem(TOKEN_STORAGE_KEY); }
    function getTokenPayload() {
      try {
        const token = getToken();
        if (!token) return null;
        const parts = token.split(".");
        if (parts.length !== 3) return null;
        let base64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
        while (base64.length % 4 !== 0) base64 += "=";
        const binary = atob(base64);
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const json = new TextDecoder("utf-8").decode(bytes);
        return JSON.parse(json);
      } catch { return null; }
    }
    function getMyUserIdFromPayload(payload){
      const candidate = payload?.userId ?? payload?.id ?? payload?.sub ?? payload?.uid ?? null;
      const n = Number(candidate);
      return Number.isFinite(n) ? n : null;
    }
    const balanceValueEl = document.getElementById("balanceValue") || { textContent: "" };
    function formatTomanFromCoins(coins) {
      const value = Number(coins || 0) * 1000;
      return value.toLocaleString("fa-IR") + " تومان";
    }
    function setAuthResult(x){ /* no-op در game.html */ }
    async function updateBalance() {
      const token = getToken();
      if (!token) return;
      try {
        const res = await fetch(api("/api/me/balance"), {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json().catch(()=>null);
        if (data?.balance != null) {
          balanceValueEl.textContent = formatTomanFromCoins(data.balance);
        }
      } catch {}
    }

    function isJwtExpired(token) {
      if (!token) return true;
      try {
        const parts = String(token).split(".");
        if (parts.length !== 3) return true;
        let base64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
        while (base64.length % 4 !== 0) base64 += "=";
        const binary = atob(base64);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        const json = new TextDecoder("utf-8").decode(bytes);
        const payload = JSON.parse(json);
        const exp = payload?.exp;
        if (!exp) return false;
        return Date.now() >= exp * 1000;
      } catch { return true; }
    }

    // ====== متغیرهای بازی ======
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const rollBtn = document.getElementById("rollBtn");
    const resetBtn = document.getElementById("resetBtn");
    const leaveGameBtn = document.getElementById("leaveGameBtn");
    const dice1El = document.getElementById("dice1");
    const dice2El = document.getElementById("dice2");
    const turnInfo = document.getElementById("turnInfo");

    const COLORS = {
      red: "#ff4d4d", green: "#2ecc71", yellow: "#f1c40f", blue: "#3498db",
      white: "#ffffff", board: "#0a0a0a", grid: "#222222",
      softRed: "#e74c3c", softGreen: "#27ae60", softYellow: "#f39c12", softBlue: "#2980b9"
    };
    const layout = {
      cells: {
        "P1":{c:7,r:2},"P2":{c:7,r:3},"P3":{c:7,r:4},"P4":{c:7,r:5},
        "P5":{c:8,r:5},"P6":{c:9,r:5},"P7":{c:10,r:5},"P8":{c:11,r:5},
        "P9":{c:11,r:6},"P10":{c:10,r:7},"P11":{c:9,r:7},"P12":{c:8,r:7},
        "P13":{c:7,r:7},"P14":{c:7,r:8},"P15":{c:7,r:9},"P16":{c:7,r:10},
        "P17":{c:7,r:11},"P18":{c:6,r:11},"P19":{c:5,r:10},"P20":{c:5,r:9},
        "P21":{c:5,r:8},"P22":{c:5,r:7},"P23":{c:4,r:7},"P24":{c:3,r:7},
        "P25":{c:2,r:7},"P26":{c:1,r:7},"P27":{c:1,r:6},"P28":{c:2,r:5},
        "P29":{c:3,r:5},"P30":{c:4,r:5},"P31":{c:5,r:5},"P32":{c:5,r:4},
        "P33":{c:5,r:3},"P34":{c:5,r:2},"P35":{c:5,r:1},"P36":{c:6,r:1},
        "S_R":{c:1,r:5},"S_B":{c:7,r:1},"S_G":{c:11,r:7},"S_Y":{c:5,r:11},
        "F_R1":{c:2,r:6},"F_R2":{c:3,r:6},"F_R3":{c:4,r:6},"F_R4":{c:5,r:6},
        "F_B1":{c:6,r:2},"F_B2":{c:6,r:3},"F_B3":{c:6,r:4},"F_B4":{c:6,r:5},
        "F_G1":{c:10,r:6},"F_G2":{c:9,r:6},"F_G3":{c:8,r:6},"F_G4":{c:7,r:6},
        "F_Y1":{c:6,r:10},"F_Y2":{c:6,r:9},"F_Y3":{c:6,r:8},"F_Y4":{c:6,r:7}
      },
      mainPath:[
        "P1","P2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12","P13","P14",
        "P15","P16","P17","P18","P19","P20","P21","P22","P23","P24","P25","P26",
        "P27","P28","P29","P30","P31","P32","P33","P34","P35","P36"
      ],
      startCells:{red:"S_R",blue:"S_B",green:"S_G",yellow:"S_Y"},
      finishCells:{
        red:["F_R1","F_R2","F_R3","F_R4"],
        blue:["F_B1","F_B2","F_B3","F_B4"],
        green:["F_G1","F_G2","F_G3","F_G4"],
        yellow:["F_Y1","F_Y2","F_Y3","F_Y4"]
      },
      entryPathIndexes:{ red:27, blue:0, green:9, yellow:18 }
    };
    const YARD_PIECES_POS = {
      red:    [[1,1],[1,2],[2,1],[2,2]],
      blue:   [[10,1],[10,2],[11,1],[11,2]],
      green:  [[10,10],[10,11],[11,10],[11,11]],
      yellow: [[1,10],[1,11],[2,10],[2,11]]
    };
    const colorOrder = ["red","green","yellow","blue"];
    const colorLabel = {red:"قرمز",green:"سبز",yellow:"زرد",blue:"آبی"};
    const SIZE = canvas.width;
    const GRID_COUNT = 13;
    const CELL = SIZE / GRID_COUNT;

    let socket = null;
    let myColor = null;
    let gameState = null;
    let currentMatchId = null;
    let currentTurnId = null;
    let lastDice1 = 0;
    let lastDice2 = 0;
    let turnTimerInterval = null;
    let lobbyCountdownInterval = null;
    let joinInProgress = false;
    let pickedDieValue = null;
    let pickedDieIndex = null;
    let moveInFlight = false;

    // ====== توابع کمکی ======
    function formatRemainingMs(deadlineAt) {
      if (!deadlineAt) return null;
      const deadline = new Date(deadlineAt).getTime();
      if (!Number.isFinite(deadline)) return null;
      return Math.ceil(Math.max(0, deadline - Date.now()) / 1000);
    }
    function stopTurnTimer() {
      if (turnTimerInterval) clearInterval(turnTimerInterval);
      turnTimerInterval = null;
    }
    function stopLobbyCountdown() {
      if (lobbyCountdownInterval) clearInterval(lobbyCountdownInterval);
      lobbyCountdownInterval = null;
    }
    function renderLobbyByDeadline(lobbyPayload) {
      const { deadlineAt, phase, searchingFor, message, filledColors } = lobbyPayload || {};
      const hasDeadline = !!deadlineAt;
      if (!hasDeadline) {
        stopLobbyCountdown();
        let t = message || "";
        if (phase === 0) t = "در صف انتظار...";
        else if (phase === 1) t = "منتظر نفر دوم...";
        else if (phase === 2) t = "منتظر نفر سوم...";
        else if (phase === 3) t = "منتظر نفر چهارم...";
        else if (phase === 4) t = "بازی شروع می‌شود...";
        if (searchingFor) t += ` (دنبال نفر ${searchingFor})`;
        joinStatusEl.textContent = t;
        return;
      }
      const deadlineAtMs = new Date(deadlineAt).getTime();
      if (!Number.isFinite(deadlineAtMs)) return;
      stopLobbyCountdown();
      const render = () => {
        const secs = formatRemainingMs(deadlineAt);
        const base = message || "منتظر شروع بازی";
        const timeStr = secs !== null ? `${secs} ثانیه` : "";
        joinStatusEl.textContent = `${base} ${timeStr}`;
        if (secs !== null && secs <= 0) stopLobbyCountdown();
      };
      render();
      lobbyCountdownInterval = setInterval(render, 500);
    }

    // ====== توابع رسم ======
    function getPieceDrawPos(p){
      if (p.state === "yard") {
        const [c,r] = YARD_PIECES_POS[p.color][p.index];
        return { x: c*CELL + CELL/2, y: r*CELL + CELL/2 };
      }
      if (p.state === "start") {
        const T = layout.cells[layout.startCells[p.color]];
        return { x: T.c*CELL + CELL/2, y: T.r*CELL + CELL/2 };
      }
      if (p.state === "path") {
        const T = layout.cells[layout.mainPath[p.pathIndex]];
        return { x: T.c*CELL + CELL/2, y: T.r*CELL + CELL/2 };
      }
      if (p.state === "home") {
        const T = layout.cells[layout.finishCells[p.color][p.homeIndex]];
        return { x: T.c*CELL + CELL/2, y: T.r*CELL + CELL/2 };
      }
      return null;
    }
    function drawYardBackgrounds(){
      const BG = {
        red:    { x:0, y:0, c:"#1e0c0c", slot:COLORS.softRed },
        blue:   { x:9, y:0, c:"#0c181e", slot:COLORS.softBlue },
        green:  { x:9, y:9, c:"#0c1e12", slot:COLORS.softGreen },
        yellow: { x:0, y:9, c:"#1e1d0c", slot:COLORS.softYellow }
      };
      for (const k in BG){
        ctx.fillStyle = BG[k].c;
        ctx.fillRect(BG[k].x*CELL, BG[k].y*CELL, 4*CELL, 4*CELL);
        ctx.strokeStyle = COLORS.grid;
        ctx.strokeRect(BG[k].x*CELL, BG[k].y*CELL, 4*CELL, 4*CELL);
      }
      for (const color of colorOrder){
        for (const [c,r] of YARD_PIECES_POS[color]){
          ctx.fillStyle = BG[color].slot;
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          ctx.strokeStyle = COLORS.grid;
          ctx.strokeRect(c*CELL, r*CELL, CELL, CELL);
        }
      }
    }
    function drawCellByName(name, color, label=""){
      const t = layout.cells[name];
      if (!t) return;
      ctx.fillStyle = color;
      ctx.fillRect(t.c*CELL, t.r*CELL, CELL, CELL);
      ctx.strokeStyle = COLORS.grid;
      ctx.strokeRect(t.c*CELL, t.r*CELL, CELL, CELL);
      if (label){
        ctx.fillStyle = "#000";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, t.c*CELL + CELL/2, t.r*CELL + CELL/2);
      }
    }
    function hexToRgb(hex) {
      const h = String(hex).replace("#", "");
      const rr = parseInt(h.slice(0, 2), 16);
      const gg = parseInt(h.slice(2, 4), 16);
      const bb = parseInt(h.slice(4, 6), 16);
      return { r: rr, g: gg, b: bb };
    }
    function getBaseHex(colorVal) {
      if (typeof COLORS !== "undefined" && COLORS && COLORS[colorVal]) return COLORS[colorVal];
      return colorVal;
    }
 function drawSphereFill(x, y, r, baseHex, opacity = 1) {

      const { r: br, g: bg, b: bb } = hexToRgb(getBaseHex(baseHex));
      ctx.save();
   ctx.globalAlpha = opacity;

      const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.05, x, y, r * 1.05);
      grad.addColorStop(0.00, "rgba(255,255,255,0.98)");
      grad.addColorStop(0.10, `rgba(${br},${bg},${bb},0.95)`);
      grad.addColorStop(0.55, `rgba(${br},${bg},${bb},0.75)`);
      grad.addColorStop(0.80, `rgba(${Math.round(br*0.45)},${Math.round(bg*0.45)},${Math.round(bb*0.45)},0.75)`);
      grad.addColorStop(1.00, "rgba(0,0,0,0.35)");
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
      ctx.globalCompositeOperation = "screen";
      const hl = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.03, x - r * 0.25, y - r * 0.35, r * 0.85);
      hl.addColorStop(0, "rgba(255,255,255,0.95)");
      hl.addColorStop(0.25, `rgba(${br},${bg},${bb},0.25)`);
      hl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hl;
      ctx.beginPath(); ctx.arc(x - r * 0.15, y - r * 0.18, r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = Math.max(1.2, r * 0.06);
      ctx.beginPath(); ctx.arc(x, y, r * 0.98, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.beginPath(); ctx.ellipse(x + r * 0.10, y + r * 0.20, r * 0.75, r * 0.65, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    function drawTurnRing(x, y, r, turnHex) {
      const { r: tr, g: tg, b: tb } = hexToRgb(getBaseHex(turnHex));
      const ringOuter = r * 1.28; const ringMid = r * 1.16;
      ctx.save();
      ctx.shadowColor = "rgba(255,255,255,0.95)"; ctx.shadowBlur = Math.max(12, r * 0.45);
      ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = Math.max(6, r * 0.14);
      ctx.beginPath(); ctx.arc(x, y, ringOuter, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(${tr},${tg},${tb},0.95)`; ctx.lineWidth = Math.max(4, r * 0.10);
      ctx.beginPath(); ctx.arc(x, y, ringMid, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath(); ctx.arc(x, y, (ringMid + ringOuter) * 0.5, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
function drawPieces() {

    function waitForSocketConnected(sock, timeoutMs = 15000) {
      if (!sock) return Promise.reject(new Error("socket is null"));
      if (sock.connected) return Promise.resolve();
      return new Promise((resolve, reject) => {
        let settled = false;
        const t = setTimeout(() => {
          if (settled) return; settled = true; cleanup();
          reject(new Error("timeout waiting for socket connect"));
        }, timeoutMs);
        function cleanup() { clearTimeout(t); sock.off("connect", onConnect); sock.off("connect_error", onErr); }
        function onConnect() { if (settled) return; settled = true; cleanup(); resolve(); }
        function onErr(err) { if (settled) return; settled = true; cleanup(); reject(err instanceof Error ? err : new Error(String(err?.message || err))); }
        sock.once("connect", onConnect); sock.once("connect_error", onErr);
      });
    }

const emojiBtn = document.getElementById('emojiBtn');
const emojiMenu = document.getElementById('emojiMenu');
const emojiItems = document.querySelectorAll('.emoji-item');

// ذخیره اموجی فعال برای هر بازیکن
const activeEmojis = {};

// نمایش اموجی روی Canvas
function drawPlayerEmoji(playerColor, nameX, nameY) {
    const emojiData = activeEmojis[playerColor];
    if (!emojiData) return;

    const elapsed = Date.now() - emojiData.sentAt;

    if (elapsed > 5000) {
        delete activeEmojis[playerColor];
        return;
    }

    const fadeDuration = 1000;
    let alpha = 1;

    if (elapsed > (5000 - fadeDuration)) {
        alpha = Math.max(
            0,
            1 - (elapsed - (5000 - fadeDuration)) / fadeDuration
        );
    }

    // جایگاه‌های red و blue بالای صفحه هستند.
    // برای آن‌ها ایموجی پایین نام قرار می‌گیرد.
    const isTopPlayer =
        playerColor === "red" ||
        playerColor === "blue";

    const emojiY = isTopPlayer
        ? nameY + 42
        : nameY - 42;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "30px serif";
    ctx.fillText(emojiData.emoji, nameX, emojiY);
    ctx.restore();
}



// باز و بسته کردن منو
emojiBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    if (emojiMenu.style.display === 'block') {
        emojiMenu.style.display = 'none';
    } else {
        const rect = emojiBtn.getBoundingClientRect();
        emojiMenu.style.left = `${rect.left + window.scrollX}px`;
        emojiMenu.style.top = `${rect.bottom + window.scrollY + 5}px`;
        emojiMenu.style.display = 'block';
    }
});

// انتخاب اموجی و ارسال به سرور
emojiItems.forEach(item => {
    item.addEventListener('click', (event) => {
        event.stopPropagation();
        const emoji = item.getAttribute('data-emoji');
        socket.emit('player:emoji_sent', { emoji: emoji });
        emojiMenu.style.display = 'none';
    });
});

// بستن منو با کلیک بیرون
document.addEventListener('click', (event) => {
    if (emojiMenu.style.display === 'block' && !emojiMenu.contains(event.target) && !emojiBtn.contains(event.target)) {
        emojiMenu.style.display = 'none';
    }
});
