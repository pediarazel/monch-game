<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Balance Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      box-sizing: border-box;
    }
    h1 { margin-top: 0; font-size: 22px; text-align: center; }
    p { color: #cbd5e1; font-size: 14px; text-align: center; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
    }
    input, select { background: #1f2937; color: #fff; outline: none; }
    button { margin-top: 14px; background: #22c55e; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #16a34a; }
    .secondary { background: #3b82f6; margin-top: 10px; }
    .secondary:hover { background: #2563eb; }
    .result {
      margin-top: 14px;
      background: #0b1220;
      padding: 12px 14px;
      border-radius: 10px;
      min-height: 48px;
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.4;
      border: 1px solid #1e293b;
      box-sizing: border-box;
    }
    .section-title {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      color: #e5e7eb;
    }
    .divider { height: 1px; background: #22314f; margin: 18px 0; border-radius: 999px; }
    .res-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
    .res-label { color: #94a3b8; font-size: 13.5px; }
    .res-val { font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>پنل مدیریت موجودی</h1>
    <p>افزایش/کاهش و مشاهده موجودی کاربر (با username)</p>

    <label for="username">نام کاربری</label>
    <input id="username" type="text" placeholder="مثلا ali" />

    <label for="amount">مقدار (تومان)</label>
    <input id="amount" type="text" inputmode="numeric" placeholder="مثلا 100,000" />

    <label for="action">عملیات</label>
    <select id="action">
      <option value="add">افزایش موجودی</option>
      <option value="subtract">کاهش موجودی</option>
    </select>

    <label for="note">توضیح (اختیاری)</label>
    <input id="note" type="text" placeholder="مثلا admin adjustment" />

    <label for="adminSecret">رمز ادمین</label>
    <input id="adminSecret" type="password" placeholder="رمز ادمین" />

    <button id="updateBtn">ثبت تغییر موجودی</button>
    <button id="getBtn" class="secondary">دریافت موجودی</button>

    <div class="result" id="result">نتیجه اینجا نمایش داده می‌شود</div>

    <div class="divider"></div>
    <div class="section-title">گزارش خزانه (Treasury Report)</div>

    <button id="treasuryBtn" class="secondary" style="margin-top:14px;">گرفتن گزارش خزانه</button>
    <div class="result" id="treasuryResult">گزارش اینجا نمایش داده می‌شود</div>

    <div class="divider"></div>
    <div class="section-title">برداشت از خزانه</div>
    <label for="deductAmount">مبلغ برداشت (تومان)</label>
    <input id="deductAmount" type="text" inputmode="numeric" placeholder="مثلا 50,000" />
    <button id="deductBtn" style="background: #ef4444; margin-top: 10px;">ثبت برداشت از خزانه</button>
    <div class="result" id="deductResult">نتیجه برداشت اینجا نمایش داده می‌شود</div>
  </div>

  <script>
    const usernameInput = document.getElementById("username");
    const amountInput = document.getElementById("amount");
    const actionInput = document.getElementById("action");
    const noteInput = document.getElementById("note");
    const adminSecretInput = document.getElementById("adminSecret");

    const resultBox = document.getElementById("result");
    const updateBtn = document.getElementById("updateBtn");
    const getBtn = document.getElementById("getBtn");

    const deductAmountInput = document.getElementById("deductAmount");
    const deductBtn = document.getElementById("deductBtn");
    const deductResultBox = document.getElementById("deductResult");

    const treasuryBtn = document.getElementById("treasuryBtn");
    const treasuryResultBox = document.getElementById("treasuryResult");

    // فرمت‌دهی ۳ رقم ۳ رقم با ویرگول
    function toComma(val) {
      if (val === null || val === undefined || val === "") return "0";
      let str = String(val).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
      str = str.replace(/[^\d.-]/g, "");
      if (!str) return "0";
      let parts = str.split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    // اتصال ویرگول‌گذاری زنده با پشتیبانی کامل از موبایل
    function attachLiveComma(inputEl) {
      if (!inputEl) return;
      const applyFormat = () => {
        let val = inputEl.value;
        if (!val) return;
        let raw = val.replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
        raw = raw.replace(/\D/g, "");
        if (!raw) {
          inputEl.value = "";
          return;
        }
        inputEl.value = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      };

      inputEl.addEventListener("input", applyFormat);
      inputEl.addEventListener("keyup", applyFormat);
      inputEl.addEventListener("change", applyFormat);
      inputEl.addEventListener("blur", applyFormat);
    }

    attachLiveComma(amountInput);
    attachLiveComma(deductAmountInput);

    function resolveTomanBalance(data) {
      if (data.tomanBalance !== undefined) return Number(data.tomanBalance);
      if (data.coinsToman !== undefined) return Number(data.coinsToman);
      if (data.balanceToman !== undefined) return Number(data.balanceToman);
      let raw = data.coins ?? data.balance ?? (data.user && (data.user.coins ?? data.user.balance)) ?? 0;
      return Number(raw);
    }

    updateBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const amountRaw = amountInput.value.replace(/,/g, "").trim();
      const action = actionInput.value;
      const note = (noteInput.value || "").trim();
      const adminSecret = adminSecretInput.value.trim();

      if (!username || !amountRaw || !adminSecret) {
        resultBox.innerHTML = '<span style="color:#ef4444;">لطفاً نام کاربری، مبلغ و رمز ادمین را کامل کنید.</span>';
        return;
      }

      let amountValue = Number(amountRaw);
      if (!Number.isFinite(amountValue) || amountValue <= 0) {
        resultBox.innerHTML = '<span style="color:#ef4444;">مبلغ باید یک عدد معتبر و بزرگ‌تر از صفر باشد.</span>';
        return;
      }

      resultBox.innerHTML = "در حال پردازش...";

      try {
        const res = await fetch("/admin/update-balance-by-username", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            amount: amountValue,
            action,
            note,
            adminSecret
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          resultBox.innerHTML = `<span style="color:#ef4444;">${data.message || "خطا در تغییر موجودی"}</span>`;
          return;
        }

        const isAdd = action === "add";
        
        let newCoins = 0;
        if (data.newCoins !== undefined) newCoins = Number(data.newCoins);
        else if (data.newBalance !== undefined) newCoins = Number(data.newBalance);
        else if (data.coins !== undefined) newCoins = Number(data.coins);
        else if (data.user && data.user.coins !== undefined) newCoins = Number(data.user.coins);

        let prevCoins = 0;
        if (data.previousCoins !== undefined) prevCoins = Number(data.previousCoins);
        else if (data.prevCoins !== undefined) prevCoins = Number(data.prevCoins);
        else if (data.oldCoins !== undefined) prevCoins = Number(data.oldCoins);
        else if (data.previousBalance !== undefined) prevCoins = Number(data.previousBalance);
        else {
          prevCoins = isAdd ? (newCoins - amountValue) : (newCoins + amountValue);
        }

        resultBox.innerHTML = `
          <div class="res-row"><span class="res-label">👤 نام کاربری:</span> <span class="res-val">${data.username || username}</span></div>
          <div class="res-row"><span class="res-label">موجودی قبلی:</span> <span class="res-val">${toComma(prevCoins)} تومان</span></div>
          <div class="res-row">
            <span class="res-label">${isAdd ? 'اضافه کردن موجودی:' : 'کم کردن موجودی:'}</span>
            <span class="res-val" style="color: ${isAdd ? '#22c55e' : '#ef4444'}; font-size: 14.5px;">
              ${isAdd ? '+' : '-'}${toComma(amountValue)} تومان
            </span>
          </div>
          <div style="margin: 4px 0; border-top: 1px dashed #334155;"></div>
          <div class="res-row"><span class="res-label">موجودی جدید:</span> <span class="res-val" style="color: #38bdf8;">${toComma(newCoins)} تومان</span></div>
        `;
      } catch (err) {
        resultBox.innerHTML = '<span style="color:#ef4444;">خطا در ارتباط با سرور</span>';
      }
    });

    getBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const adminSecret = adminSecretInput.value.trim();

      if (!username || !adminSecret) {
        resultBox.innerHTML = '<span style="color:#ef4444;">نام کاربری و رمز ادمین را وارد کنید.</span>';
        return;
      }

      resultBox.innerHTML = "در حال دریافت موجودی...";
      const url = `/admin/user-balance/${encodeURIComponent(username)}?adminSecret=${encodeURIComponent(adminSecret)}&t=${Date.now()}`;

      try {
        const res = await fetch(url, {
          method: "GET",
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          resultBox.innerHTML = `<span style="color:#ef4444;">${data.message || "خطا در دریافت موجودی"}</span>`;
          return;
        }

        const bal = resolveTomanBalance(data);
        resultBox.innerHTML = `
          <div class="res-row"><span class="res-label">👤 نام کاربری:</span> <span class="res-val">${data.username || username}</span></div>
          <div class="res-row"><span class="res-label">موجودی:</span> <span class="res-val" style="color: #22c55e; font-size: 14.5px;">${toComma(bal)} تومان</span></div>
        `;
      } catch (err) {
        resultBox.innerHTML = '<span style="color:#ef4444;">خطا در ارتباط با سرور</span>';
      }
    });

    function showTreasuryResult(data) {
      if (typeof data === "string") {
        treasuryResultBox.innerHTML = data;
        return;
      }
      if (!data.success) {
        treasuryResultBox.innerHTML = `<span style="color:#ef4444;">${data.message || "خطا در دریافت اطلاعات"}</span>`;
        return;
      }

      treasuryResultBox.innerHTML = `
        <div style="line-height: 1.8; font-size: 14.5px; direction: rtl; text-align: right;">
          <div>💰 <b>درآمد امروز (۲۴ ساعته):</b> <span style="color: #22c55e; font-weight: bold;">${toComma(data.todayCutToman)} تومان</span></div>
          <div>🎮 <b>تعداد دست‌های امروز:</b> ${toComma(data.todayCount || 0)} بازی</div>
          <div style="margin: 6px 0; border-top: 1px dashed #334155;"></div>
          <div>🏦 <b>موجودی کل خزانه:</b> <span style="color: #38bdf8; font-weight: bold;">${toComma(data.totalBalanceToman)} تومان</span></div>
        </div>
      `;
    }

    treasuryBtn.addEventListener("click", async () => {
      const adminSecret = adminSecretInput.value.trim();

      if (!adminSecret) {
        showTreasuryResult('<span style="color:#ef4444;">رمز ادمین را وارد کنید.</span>');
        return;
      }

      showTreasuryResult("در حال دریافت گزارش...");
      try {
        const res = await fetch(
          `/admin/treasury-report?range=day&adminSecret=${encodeURIComponent(adminSecret)}`
        );

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showTreasuryResult(`<span style="color:#ef4444;">${data.message || "خطا در دریافت گزارش خزانه"}</span>`);
          return;
        }
        showTreasuryResult(data);
      } catch (e) {
        showTreasuryResult('<span style="color:#ef4444;">خطا در ارتباط با سرور</span>');
      }
    });

    deductBtn.addEventListener("click", async () => {
      const amount = Number(deductAmountInput.value.replace(/,/g, "").trim());
      const adminSecret = adminSecretInput.value.trim();

      if (!amount || amount <= 0 || !adminSecret) {
        deductResultBox.innerHTML = '<span style="color:#ef4444;">لطفاً مبلغ و رمز ادمین را وارد کنید.</span>';
        return;
      }

      deductResultBox.innerHTML = "در حال ثبت درخواست...";
      try {
        const res = await fetch("/admin/treasury-deduct", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount, adminSecret })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          deductResultBox.innerHTML = `<span style="color:#ef4444;">${data.message || "خطا در برداشت از خزانه"}</span>`;
          return;
        }
        deductResultBox.innerHTML = '<span style="color:#22c55e; font-weight:bold;">✅ برداشت با موفقیت ثبت شد.</span>';
        treasuryBtn.click();
      } catch (err) {
        deductResultBox.innerHTML = '<span style="color:#ef4444;">خطا در ارتباط با سرور</span>';
      }
    });
  </script>
</body>
</html>
