<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Balance Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 { margin-top: 0; font-size: 22px; text-align: center; }
    p { color: #cbd5e1; font-size: 14px; text-align: center; margin-bottom: 20px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
    input, select { background: #1f2937; color: #fff; outline: none; }
    button { margin-top: 14px; background: #22c55e; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #16a34a; }
    .secondary { background: #3b82f6; margin-top: 10px; }
    .secondary:hover { background: #2563eb; }
    .danger { background: #ef4444; margin-top: 10px; }
    .danger:hover { background: #dc2626; }
    .result {
      margin-top: 18px;
      background: #0b1220;
      padding: 12px;
      border-radius: 10px;
      min-height: 52px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: #e2e8f0;
    }
    .section-title{
      margin-top: 24px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      color: #e5e7eb;
    }
    .divider{ height: 1px; background: #22314f; margin: 18px 0; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>پنل مدیریت موجودی (تومان)</h1>
    <p>افزایش، کاهش و مشاهدهٔ موجودی کاربر با تومان واقعی</p>

    <label for="username">نام کاربری</label>
    <input id="username" type="text" placeholder="مثلا ali" />

    <label for="amount">مبلغ (تومان)</label>
    <input id="amount" type="text" inputmode="numeric" placeholder="مثلاً 100,000" />

    <label for="action">عملیات</label>
    <select id="action">
      <option value="add">افزایش موجودی</option>
      <option value="subtract">کاهش موجودی</option>
    </select>

    <label for="note">توضیح (اختیاری)</label>
    <input id="note" type="text" placeholder="مثلا admin adjustment" />

    <label for="adminSecret">رمز ادمین</label>
    <input id="adminSecret" type="password" placeholder="رمز ادمین" />

    <button id="updateBtn">ثبت تغییر موجودی</button>
    <button id="getBtn" class="secondary">دریافت موجودی</button>

    <div class="result" id="result">نتیجه اینجا نمایش داده می‌شود</div>

    <div class="divider"></div>
    <div class="section-title">مدیریت درآمد و خزانه</div>

    <button id="treasuryBtn" class="secondary" style="margin-top:14px;">مشاهده درآمد امروز و موجودی کل</button>
    <div class="result" id="treasuryResult">اطلاعات خزانه اینجا نمایش داده می‌شود</div>

    <label for="deductAmount">مبلغ کسر از موجودی کل خزانه (تومان)</label>
    <input id="deductAmount" type="text" inputmode="numeric" placeholder="مثلاً 50,000" />
    <button id="deductBtn" class="danger">کسر از موجودی کل</button>
  </div>

<script>
  const usernameInput = document.getElementById("username");
  const amountInput = document.getElementById("amount");
  const actionInput = document.getElementById("action");
  const noteInput = document.getElementById("note");
  const adminSecretInput = document.getElementById("adminSecret");

  const resultBox = document.getElementById("result");
  const updateBtn = document.getElementById("updateBtn");
  const getBtn = document.getElementById("getBtn");

  const treasuryBtn = document.getElementById("treasuryBtn");
  const treasuryResultBox = document.getElementById("treasuryResult");
  const deductAmountInput = document.getElementById("deductAmount");
  const deductBtn = document.getElementById("deductBtn");

  function formatToman(value) {
    return `${Number(value || 0).toLocaleString("en-US")} تومان`;
  }

  function showResult(data) {
    resultBox.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  function showTreasuryResult(data) {
    treasuryResultBox.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }

  function showUserBalance(data) {
    resultBox.textContent = [
      `نام کاربری: ${data.username}`,
      `شناسه کاربر: ${data.userId}`,
      `نقش: ${data.role}`,
      `موجودی: ${formatToman(data.coinsToman ?? Number(data.coins || 0) * 1000)}`,
    ].join("\n");
  }

  updateBtn.addEventListener("click", async () => {
    const username = usernameInput.value.trim();
    const amountRaw = amountInput.value.trim();
    const action = actionInput.value;
    const note = (noteInput.value || "").trim();
    const adminSecret = adminSecretInput.value.trim();

    if (!username || !amountRaw || !adminSecret) {
      showResult("نام کاربری، مبلغ و رمز ادمین را کامل کن.");
      return;
    }

    const amountToman = Number(amountRaw.replace(/,/g, ""));
    if (!Number.isInteger(amountToman) || amountToman <= 0) {
      showResult("مبلغ باید یک عدد صحیح و بزرگ‌تر از صفر باشد.");
      return;
    }

    if (amountToman % 1000 !== 0) {
      showResult("مبلغ را به هزار تومان وارد کن.");
      return;
    }

    try {
      const res = await fetch("/admin/update-balance-by-username", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          amount: amountToman,
          action,
          note,
          adminSecret
        })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.success) {
        showResult(data.message || "خطا در تغییر موجودی");
        return;
      }

      const actionLabel = action === "add" ? "افزایش" : "کاهش";

      resultBox.textContent = [
        `عملیات با موفقیت انجام شد.`,
        `کاربر: ${username}`,
        `نوع عملیات: ${actionLabel}`,
        `مبلغ عملیات: ${formatToman(amountToman)}`,
        `موجودی جدید: ${formatToman(data.newCoinsToman ?? Number(data.newCoins || 0) * 1000)}`,
      ].join("\n");

      amountInput.value = "";
    } catch (err) {
      showResult("خطا در ارتباط با سرور");
    }
  });

  getBtn.addEventListener("click", async () => {
    const username = usernameInput.value.trim();
    const adminSecret = adminSecretInput.value.trim();

    if (!username || !adminSecret) {
      showResult("نام کاربری و رمز ادمین را وارد کن.");
      return;
    }

    const url = `/admin/user-balance/${encodeURIComponent(username)}?adminSecret=${encodeURIComponent(adminSecret)}&t=${Date.now()}`;

    try {
      const res = await fetch(url, {
        method: "GET",
        cache: "no-store",
        headers: { "Cache-Control": "no-cache" }
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.success) {
        showResult(data.message || "خطا در دریافت موجودی");
        return;
      }

      showUserBalance(data);
    } catch (err) {
      showResult("خطا در ارتباط با سرور");
    }
  });

  treasuryBtn.addEventListener("click", async () => {
    const adminSecret = adminSecretInput.value.trim();

    if (!adminSecret) {
      showTreasuryResult("رمز ادمین را وارد کن.");
      return;
    }

    showTreasuryResult("در حال دریافت اطلاعات خزانه...");
    try {
      const res = await fetch(
        `/admin/treasury-report?adminSecret=${encodeURIComponent(adminSecret)}&t=${Date.now()}`
      );

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.success) {
        showTreasuryResult(data.message || "خطا در دریافت گزارش خزانه");
        return;
      }

      treasuryResultBox.textContent = [
        `📊 درآمد امروز: ${formatToman(data.todayCutToman)}`,
        `تعداد دست بازی امروز: ${data.todayCount}`,
        `💰 موجودی کل فعلی خزانه: ${formatToman(data.totalBalanceToman)}`,
      ].join("\n");
    } catch (err) {
      showTreasuryResult("خطا در ارتباط با سرور");
    }
  });

  deductBtn.addEventListener("click", async () => {
    const rawAmount = deductAmountInput.value.trim();
    const adminSecret = adminSecretInput.value.trim();

    if (!rawAmount || !adminSecret) {
      showTreasuryResult("مبلغ کسر و رمز ادمین را وارد کن.");
      return;
    }

    const amountToman = Number(rawAmount.replace(/,/g, ""));
    if (!Number.isInteger(amountToman) || amountToman <= 0) {
      showTreasuryResult("مبلغ باید یک عدد صحیح و بزرگ‌تر از صفر باشد.");
      return;
    }

    if (amountToman % 1000 !== 0) {
      showTreasuryResult("مبلغ را به هزار تومان وارد کن.");
      return;
    }

    if (!confirm(`آیا از کسر مبلغ ${formatToman(amountToman)} از موجودی کل خزانه مطمئن هستید؟`)) {
      return;
    }

    showTreasuryResult("در حال کسر موجودی...");
    try {
      const res = await fetch("/admin/treasury-deduct", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          amount: amountToman,
          adminSecret
        })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || !data.success) {
        showTreasuryResult(data.message || "خطا در کسر موجودی خزانه");
        return;
      }

      treasuryResultBox.textContent = [
        `✅ ${data.message}`,
        `مبلغ کسر شده: ${formatToman(data.deductedToman)}`,
        `💰 موجودی جدید کل خزانه: ${formatToman(data.newTotalBalanceToman)}`,
      ].join("\n");

      deductAmountInput.value = "";
    } catch (err) {
      showTreasuryResult("خطا در ارتباط با سرور");
    }
  });

  // فرمت سه رقم کاما خودکار برای تمام فیلدهای مبلغ
  document.querySelectorAll('input[id*="amount" i], input[id*="Amount" i]').forEach((input) => {
    input.addEventListener('input', () => {
      const onlyNumbers = input.value.replace(/[^\d]/g, '');
      input.value = onlyNumbers.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    });
  });
</script>

</body>
</html>
