<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monopoly Online - لابی</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0a0a0a;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        font-size: 16px;
        touch-action:manipulation;
      }

.panel{
  width:min(92vw,430px);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  align-items:center;
  background:#101010;
  border:1px solid #252525;
  border-radius:14px;
  padding:10px;
}


      .row{ width:100%; max-width:700px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }

button{
  border:none;
  background:#fff;
  color:#000;
  border-radius:10px;
  padding:10px 14px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.2s;
}

      button:active{ background:#ccc; }
      button:disabled{ opacity:0.4; cursor:not-allowed; }

      .info{ width:100%; text-align:center; font-size:14px; line-height:1.8; margin-top:5px; }
      .muted{ color:#cbd5e1; font-size:13px; }
input, select{
  width:100%;
  border:none;
  border-radius:10px;
  padding:10px;
  font-size:14px;
  background:#1f2937;
  color:#fff;
  outline:none;
}

.card{
  width:min(92vw,430px);
  background:#111827;
  border-radius:14px;
  padding:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  margin-bottom:12px;
}
#lobbyCountdownBox{
  width:min(92vw,430px);
  margin-top:12px;
  padding:14px 12px;
  border:1px solid #f59e0b;
  border-radius:14px;
  background:linear-gradient(135deg,#201708,#111827);
  color:#fbbf24;
  text-align:center;
  font-size:30px;
  font-weight:900;
  line-height:1.2;
  box-shadow:0 8px 24px rgba(245,158,11,0.16);
}

#lobbyCountdownBox small{
  display:block;
  margin-top:6px;
  color:#d1d5db;
  font-size:13px;
  font-weight:normal;
}
/* ========== آموزش تصویری بازی ========== */
#helpBtn{
  width:100%;
  margin-top:10px;
  background:#222;
  color:#fff;
  border:1px solid #444;
}

#gameHelpModal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,0.84);
}

#gameHelpModal.show{
  display:flex;
}

.help-card{
  position:relative;
  width:min(94vw,410px);
  min-height:500px;
  overflow:hidden;
  border:1px solid #3b3b3b;
  border-radius:20px;
  background:linear-gradient(160deg,#171717,#090909);
  box-shadow:0 18px 60px rgba(0,0,0,.65);
  padding:22px 16px 16px;
  text-align:center;
}

.help-close{
  position:absolute;
  top:10px;
  left:10px;
  width:38px;
  height:38px;
  min-width:38px;
  padding:0;
  border-radius:50%;
  background:#2a2a2a;
  color:#fff;
  font-size:22px;
  line-height:1;
}

.help-title{
  font-size:20px;
  font-weight:900;
  color:#fff;
  margin:4px 42px 8px;
}

.help-dots{
  direction:ltr;
  display:flex;
  justify-content:center;
  gap:7px;
  margin:12px 0 18px;
}

.help-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#555;
  transition:.2s;
}

.help-dot.active{
  width:24px;
  border-radius:8px;
  background:#3b82f6;
}

.help-visual{
  height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 14px;
  border:1px solid #303030;
  border-radius:18px;
  background:radial-gradient(circle at top,#242424,#111);
  overflow:hidden;
}

.help-text{
  min-height:66px;
  padding:0 10px;
  color:#e5e7eb;
  font-size:16px;
  font-weight:700;
  line-height:2;
}

.help-actions{
  display:flex;
  direction:rtl;
  gap:10px;
  margin-top:14px;
}

.help-actions button{
  flex:1;
  min-height:48px;
  font-size:15px;
}

#helpPrevBtn{
  background:#292929;
  color:#fff;
}

#helpNextBtn{
  background:#3b82f6;
  color:#fff;
}

/* تصویر مرحله ۱: صفحه بازی */
.help-board{
  display:grid;
  grid-template-columns:repeat(4,42px);
  grid-template-rows:repeat(4,42px);
  gap:4px;
  padding:10px;
  transform:rotate(45deg);
}

.help-cell{
  border:1px solid #555;
  background:#222;
  border-radius:7px;
}

.help-cell.red{background:#ef4444;}
.help-cell.green{background:#22c55e;}
.help-cell.yellow{background:#eab308;}
.help-cell.blue{background:#3b82f6;}

/* تصویر مرحله ۲: تاس و مهره */
.help-turn{
  display:flex;
  align-items:center;
  gap:20px;
  direction:ltr;
}

.help-dice{
  display:flex;
  width:75px;
  height:75px;
  align-items:center;
  justify-content:center;
  border:3px solid #fff;
  border-radius:15px;
  background:#1d4ed8;
  color:#fff;
  font-size:42px;
  box-shadow:0 0 25px rgba(59,130,246,.6);
}

.help-piece{
  width:54px;
  height:54px;
  border:5px solid #fff;
  border-radius:50%;
  background:#ef4444;
  box-shadow:0 0 0 8px rgba(239,68,68,.2),0 0 28px #ef4444;
  animation:helpBlink 1s infinite alternate;
}

@keyframes helpBlink{
  from{transform:scale(.9);opacity:.55;}
  to{transform:scale(1.1);opacity:1;}
}

/* تصویر مرحله ۳: تاس ۶ و خروج مهره */
.help-six{
  position:relative;
  width:240px;
  height:155px;
}

.help-home{
  position:absolute;
  right:8px;
  top:46px;
  width:70px;
  height:70px;
  border:3px solid #ef4444;
  border-radius:14px;
  background:rgba(239,68,68,.18);
}

.help-home::after{
  content:"●";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ef4444;
  font-size:48px;
}

.help-arrow{
  position:absolute;
  right:84px;
  top:68px;
  color:#fff;
  font-size:42px;
  direction:ltr;
}

.help-six-dice{
  position:absolute;
  left:4px;
  top:39px;
  width:70px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-size:38px;
  font-weight:900;
}

/* تصویر مرحله ۴: زدن مهره */
.help-hit{
  position:relative;
  width:245px;
  height:145px;
}

.help-hit .red-piece,
.help-hit .blue-piece{
  position:absolute;
  width:55px;
  height:55px;
  border:4px solid #fff;
  border-radius:50%;
}

.help-hit .red-piece{
  right:25px;
  top:44px;
  background:#ef4444;
}

.help-hit .blue-piece{
  left:25px;
  top:44px;
  background:#3b82f6;
  opacity:.55;
}

.help-hit .boom{
  position:absolute;
  inset:42px 0 auto;
  text-align:center;
  font-size:55px;
}

/* تصویر مرحله ۵: برد */
.help-win{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.help-trophy{
  font-size:90px;
  filter:drop-shadow(0 0 18px rgba(234,179,8,.65));
}

.help-finish-pieces{
  display:flex;
  gap:8px;
}

.help-finish-pieces i{
  width:25px;
  height:25px;
  border:2px solid #fff;
  border-radius:50%;
  background:#22c55e;
}

/* تصویر مرحله ۶: زمان و اتصال */
.help-time{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:70px;
}

.help-time span:last-child{
  font-size:62px;
}
.finish-pieces{
  display:flex;
  gap:8px;
}

.finish-pieces i{
  width:25px;
  height:25px;
  border:2px solid #fff;
  border-radius:50%;
  background:#22c55e;
}
/* تصویر مرحله لابی */
.help-lobby{
  width:245px;
  display:flex;
  flex-direction:column;
  gap:11px;
  direction:rtl;
}

.help-lobby-balance{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px;
  border:1px solid #424242;
  border-radius:11px;
  background:#191919;
  color:#facc15;
  font-size:15px;
  font-weight:900;
}

.help-lobby-select{
  padding:11px;
  border:1px solid #505050;
  border-radius:11px;
  background:#252525;
  color:#f1f5f9;
  font-size:14px;
}

.help-lobby-join{
  padding:11px;
  border-radius:11px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
  font-weight:900;
  box-shadow:0 6px 18px rgba(37,99,235,.35);
}

.help-lobby-wait{
  color:#d1d5db;
  font-size:14px;
  font-weight:700;
}

.help-lobby-wait strong{
  color:#fbbf24;
  font-size:20px;
}

    </style>
</head>
<body>

  <div class="panel">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px; width:100%;">
      <div class="muted">ورود به صف بازی (بر اساس Tier)</div>

      <div style="display:flex; gap:10px; width:100%; justify-content:center; flex-wrap:wrap; margin-top:6px;">

>
  خروج از صف
</button>
<button id="helpBtn" type="button">❔ آموزش تصویری بازی</button>

      </div>

<div class="muted" style="margin-top:2px;" id="joinMeta">

        قیمت ورودی از موجودی شما کم می‌شود. جایزهٔ برنده ۹۰٪ مبلغ کل است.

      <div class="muted" id="socketStatus" style="min-height:18px;"></div>

<!-- ========== پنجره آموزش تصویری ========== -->
<div id="gameHelpModal" aria-hidden="true">
  <div class="help-card" role="dialog" aria-modal="true" aria-label="آموزش بازی منچ">

<div class="help-dots" aria-hidden="true">
  <span class="help-dot active"></span>

  <span class="help-dot"></span>
  <span class="help-dot"></span>
  <span class="help-dot"></span>
  <span class="help-dot"></span>
</div>


    <div id="helpVisual" class="help-visual"></div>

</div>
<!-- ========== پایان پنجره آموزش تصویری ========== -->

  <pre id="debug" aria-label="debug" style="display:none;"></pre>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    (function(){
      // --- Global Refs ---
      const debugEl = document.getElementById('debug');
      const socketStatusEl = document.getElementById('socketStatus');
      const joinStatusEl = document.getElementById('joinStatus');
      const peopleNewsEl = document.getElementById('peopleNews');
      const serverMsgEl = document.getElementById('serverMsg');
      const lobbyCountdownBoxEl = document.getElementById('lobbyCountdownBox');

      const balanceValueEl = document.getElementById('balanceValue');
const logoutBtn = document.getElementById('logoutBtn');
const joinBtn = document.getElementById('joinBtn');
const leaveQueueBtn = document.getElementById('leaveQueueBtn');
const tierInput = document.getElementById('tierInput');

      const joinMeta = document.getElementById('joinMeta');

      // --- Basic Setup ---
      let lastDebugData = {};
      function setDebug(value) {
        try {
          let nextValue = value;
          if (typeof value === "function") nextValue = value(lastDebugData);
          if (nextValue && typeof nextValue === "object" && !Array.isArray(nextValue)) {
            lastDebugData = nextValue;
          } else {
            lastDebugData = nextValue;
          }
          debugEl.textContent = typeof nextValue === "string" ? nextValue : JSON.stringify(nextValue, null, 2);
        } catch (error) {
          debugEl.textContent = String(error?.message || value || "Debug error");
        }
      }
      window.addEventListener('error', (e)=> console.error('Page Error:', e.message || e.error || e));
      window.addEventListener('unhandledrejection', (e)=> console.error('Promise Error:', e.reason && e.reason.message ? e.reason.message : e));

      const SOCKET_URL = "https://monch-game.onrender.com";
      const API_BASE = "https://monch-game.onrender.com";
      function api(path){ return API_BASE.replace(/\/$/,'') + path; }

      // --- Token helpers ---
      const TOKEN_STORAGE_KEY = "token";
      function normalizeToken(value) {
        if (value == null) return "";
        let token = String(value).trim();
        if ((token.startsWith('"') && token.endsWith('"')) || (token.startsWith("'") && token.endsWith("'"))) {
          try { token = JSON.parse(token); } catch { token = token.slice(1, -1); }
        }
        token = String(token || "").trim();
        token = token.replace(/^Bearer\s+/i, "").trim();
        return token;
      }
      function getToken() {
        const storedToken = localStorage.getItem(TOKEN_STORAGE_KEY);
        const token = normalizeToken(storedToken);
        if (token && token !== storedToken) localStorage.setItem(TOKEN_STORAGE_KEY, token);
        return token;
      }
      function setToken(value) {
        const token = normalizeToken(value);
        if (!token) { localStorage.removeItem(TOKEN_STORAGE_KEY); return ""; }
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
        return token;
      }
      function clearToken() { localStorage.removeItem(TOKEN_STORAGE_KEY); }

function isJwtExpired(token) {
  if (!token) return true;

  try {
    const parts = token.split(".");

    if (parts.length !== 3) {
      return true;
    }

    const base64 = parts[1]
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const paddedBase64 = base64.padEnd(
      base64.length + ((4 - (base64.length % 4)) % 4),
      "="
    );

    const payload = JSON.parse(atob(paddedBase64));
    const currentTime = Math.floor(Date.now() / 1000);

    return !payload.exp || payload.exp <= currentTime;
  } catch (e) {
    console.error("JWT expiration check failed:", e);
    return true;
  }
}


      // --- Balance ---
      balanceValueEl.textContent = "0 تومان";
      let balanceIntervalId = null;
      const BALANCE_REFRESH_MS = 5000;
      function startBalanceAutoRefresh(){
        if (balanceIntervalId) clearInterval(balanceIntervalId);
        updateBalance().catch(()=>{});
        balanceIntervalId = setInterval(() => updateBalance().catch(()=>{}), BALANCE_REFRESH_MS);
      }
      function stopBalanceAutoRefresh(){
        if (balanceIntervalId) clearInterval(balanceIntervalId);
        balanceIntervalId = null;
      }
      async function updateBalance() {
        const token = getToken();
        if (!token || isJwtExpired(token)) {
           balanceValueEl.textContent = "0 تومان";
           stopBalanceAutoRefresh();
           return;
        }
        try {
          const res = await fetch(api("/api/me/balance"), {
            method: "GET", headers: { "Authorization": "Bearer " + token }, cache: "no-store"
          });
          let data;
          try { data = await res.json(); } catch { data = null; }

          if (res.ok && data && data.coins != null) {
            const value = Number(data.coins || 0) * 1000;
            balanceValueEl.textContent = `${value.toLocaleString("en-US")} تومان`;
          } else if (!res.ok && res.status === 401) {
             console.log("Balance fetch failed: 401 Unauthorized. Clearing token.");
             clearToken();
             stopBalanceAutoRefresh();
             balanceValueEl.textContent = "0 تومان";
             window.location.href = "/index.html";
          }
        } catch (e) { console.error("Balance update error:", e); }
      }

      // --- Lobby Logic ---
      let currentMatchId = null;
      let lobbyCountdownInterval = null;
      let joinInProgress = false;
      let socket = null;

      function connectSocketForLobby() {
        const token = getToken();
        if (!token || isJwtExpired(token)) {
          socketStatusEl.textContent = "❌ توکن نامعتبر یا منقضی شده.";
          serverMsgEl.textContent = "لطفاً دوباره وارد شوید.";
          setTimeout(() => window.location.href = "/index.html", 2000);
          return null;
        }

        if (socket && socket.connected) return socket;
        if (socket) { try { socket.removeAllListeners(); socket.disconnect(); } catch {} socket = null; }

        socket = io(SOCKET_URL, {
          auth: { token }, autoConnect: false, transports: ["websocket", "polling"],
          reconnection: true, reconnectionAttempts: 5, reconnectionDelay: 1000
        });

        socket.on("connect", () => {
          socketStatusEl.textContent = `✅ متصل به سرور (${socket.id})`;
          updateBalance();
          socket.emit("game:restoreSession", {}, (resp) => {
             if (resp?.success && resp?.restored && resp?.matchId) {
                currentMatchId = String(resp.matchId);
                serverMsgEl.textContent = "بازی شما بازیابی شد. در حال انتقال...";
                setTimeout(() => window.location.href = `/game.html?matchId=${currentMatchId}`, 1000);
              }
          });
        });

        socket.on("connect_error", error => {
          const message = error?.message || String(error || "خطای نامشخص");
          socketStatusEl.textContent = `❌ اتصال خطا: ${message}`;
          setDebug({ socketConnectError: { message, name: error?.name || null } });
          if (error.data?.code === 'invalid token' || message.includes('unauthorized')) {
             console.log("Connection failed due to invalid token. Clearing token and redirecting.");
             clearToken();
             setTimeout(() => window.location.href = "/index.html", 2000);
          }
        });

        socket.on("disconnect", reason => {
          socketStatusEl.textContent = `⚠️ قطع شد: ${reason}`;
          stopLobbyCountdown();
          if (reason === "io server disconnect" || reason === "io client disconnect") {
            return;
          }
          serverMsgEl.textContent = "در حال تلاش برای اتصال مجدد...";
        });

        socket.on("game:started", payload => {
          stopLobbyCountdown();
          joinStatusEl.textContent = "🎮 بازی شروع شد!";
          peopleNewsEl.textContent = "در حال انتقال به صفحه بازی...";
          if (payload?.matchId) {
            currentMatchId = String(payload.matchId);
            setTimeout(() => window.location.href = `/game.html?matchId=${currentMatchId}`, 500);
          }
        });

        socket.on("lobby:status", data => {
          if (!data) return;
          renderLobbyByDeadline(data);
          if (data?.phase === 4) {
            peopleNewsEl.textContent = "🎮 بازی شروع می‌شود!";
          } else if (data?.searchingFor) {
            peopleNewsEl.textContent = `⏳ در حال جستجوی نفر ${data.searchingFor}...`;
          } else {
            peopleNewsEl.textContent = "";
          }
        });

        socket.on("match:error", payload => {
          const message = payload?.message || "خطا در بازی/صف";
          serverMsgEl.textContent = `❌ ${message}`;
          joinStatusEl.textContent = "❌ خطا";
          setDebug({ matchError: payload });
          joinInProgress = false;
          joinBtn.disabled = false;
        });

        socket.on("reconnect_attempt", attemptNumber => {
          socketStatusEl.textContent = `تلاش مجدد اتصال (${attemptNumber})...`;
        });
        socket.on("reconnect_failed", () => {
          socketStatusEl.textContent = "❌ اتصال مجدد ناموفق.";
        });

        socket.connect();
        return socket;
      }

function renderLobbyByDeadline(data) {
  if (!data) return;

  joinStatusEl.textContent = data.message || "";
  serverMsgEl.textContent = "";

  const phase = Number(data.phase || 0);
  const searchingFor = Number(data.searchingFor || 0);

  if (phase === 4) {
    peopleNewsEl.textContent = "🎮 بازی شروع می‌شود...";
  } else if (searchingFor > 0) {
    peopleNewsEl.textContent = `⏳ در حال جستجوی نفر ${searchingFor}...`;
  } else {
    peopleNewsEl.textContent = "";
  }

  if (data.deadlineAt) {
    startLobbyCountdown(
      data.deadlineAt,
      data.message || "در حال جستجوی بازیکن"
    );
  } else {
    stopLobbyCountdown();
  }
}

function startLobbyCountdown(deadlineAt, message) {
  stopLobbyCountdown();

  const deadlineMs = new Date(deadlineAt).getTime();

  if (!Number.isFinite(deadlineMs)) {
    return;
  }

  const updateCountdown = () => {
    const remainingMs = deadlineMs - Date.now();
    const seconds = Math.max(0, Math.ceil(remainingMs / 1000));

    joinStatusEl.textContent = message;

    if (lobbyCountdownBoxEl) {
      lobbyCountdownBoxEl.hidden = false;
      lobbyCountdownBoxEl.innerHTML = `
        ⏳ ${seconds.toLocaleString("fa-IR")} ثانیه
        <small>زمان باقی‌مانده برای تکمیل بازیکنان</small>
      `;
    }

    if (remainingMs <= 0) {
      stopLobbyCountdown();
      peopleNewsEl.textContent = "⏳ در انتظار شروع بازی...";
    }
  };

  updateCountdown();

  lobbyCountdownInterval = setInterval(updateCountdown, 500);
}

function stopLobbyCountdown() {
  if (lobbyCountdownInterval) {
    clearInterval(lobbyCountdownInterval);
  }

  lobbyCountdownInterval = null;

  if (lobbyCountdownBoxEl) {
    lobbyCountdownBoxEl.hidden = true;
  }
}

          }
try {
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      reject(new Error("مهلت اتصال تمام شد"));
    }, 10000);

    if (newSocket.connected) {
      clearTimeout(timeout);
      resolve();
      return;
    }

    newSocket.once("connect", () => {
      clearTimeout(timeout);
      resolve();
    });

    newSocket.once("connect_error", (err) => {
      clearTimeout(timeout);
      reject(err);
    });
  });
} catch (err) {
  serverMsgEl.textContent = `❌ خطا در اتصال: ${err.message || err}`;
  joinInProgress = false;
  joinBtn.disabled = false;
  return;
}

        }

          setDebug({ roomJoinResponse: resp });
          if (resp?.success) {
            currentMatchId = resp.matchId ? String(resp.matchId) : null;
            leaveQueueBtn.hidden = !currentMatchId;
leaveQueueBtn.disabled = !currentMatchId;
tierInput.disabled = true;

            if (resp.waiting || resp.status === "waiting") {
              joinStatusEl.textContent = "⏳ منتظر نفرات بیشتر...";
              serverMsgEl.textContent = "در صف انتظار...";
            } else {
              joinStatusEl.textContent = "✅ ورود موفق!";
              serverMsgEl.textContent = "بازی در حال شروع است...";
            }
          } else {
            const message = resp?.message || "خطا در ورود به صف";
            serverMsgEl.textContent = `❌ ${message}`;

      // --- Leave Queue ---
      leaveQueueBtn.addEventListener("click", () => {
        if (!currentMatchId) {
          serverMsgEl.textContent = "شما در صف فعالی نیستید.";
          leaveQueueBtn.hidden = true;
          leaveQueueBtn.disabled = true;
          tierInput.disabled = false;
          joinBtn.disabled = false;
          return;
        }

        if (!socket || !socket.connected) {
          serverMsgEl.textContent = "❌ اتصال به سرور برقرار نیست.";
          return;
        }

        leaveQueueBtn.disabled = true;
        serverMsgEl.textContent = "در حال خروج از صف...";

        socket.emit("game:leave", { matchId: currentMatchId }, (resp) => {
          if (!resp?.success) {
            serverMsgEl.textContent =
              `❌ ${resp?.message || "خروج از صف ناموفق بود."}`;

            leaveQueueBtn.disabled = false;
            return;
          }

          stopLobbyCountdown();

          currentMatchId = null;
          joinInProgress = false;

          leaveQueueBtn.hidden = true;
          leaveQueueBtn.disabled = true;

          joinBtn.disabled = false;
          tierInput.disabled = false;

          joinStatusEl.textContent = "";
          peopleNewsEl.textContent = "";
          serverMsgEl.textContent = "✅ از صف بازی خارج شدی.";

          updateBalance().catch(() => {});
        });
      });

      function renderHelpSlide() {
        const slide = helpSlides[helpStep];
        helpVisual.innerHTML = slide.visual;
        helpText.innerHTML = slide.text;

        helpDots.forEach((dot, index) => {
          dot.classList.toggle("active", index === helpStep);
        });

        helpPrevBtn.disabled = helpStep === 0;
        helpNextBtn.textContent = helpStep === helpSlides.length - 1
          ? "متوجه شدم ✓"
          : "بعدی";
      }

      function openGameHelp() {
        helpStep = 0;
        renderHelpSlide();
        gameHelpModal.classList.add("show");
        gameHelpModal.setAttribute("aria-hidden", "false");
      }

      function closeGameHelp() {
        gameHelpModal.classList.remove("show");
        gameHelpModal.setAttribute("aria-hidden", "true");
      }

      helpBtn.addEventListener("click", openGameHelp);
      helpCloseBtn.addEventListener("click", closeGameHelp);

      helpPrevBtn.addEventListener("click", () => {
        if (helpStep <= 0) return;
        helpStep -= 1;
        renderHelpSlide();
      });

      helpNextBtn.addEventListener("click", () => {
        if (helpStep >= helpSlides.length - 1) {
          closeGameHelp();
          return;
        }
        helpStep += 1;
        renderHelpSlide();
      });
